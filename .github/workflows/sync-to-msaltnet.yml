name: Sync public site to msaltnet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-msaltnet-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'dev-team-404/ax-notes-public'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          repository: msaltnet/ax-notes-public
          ref: main
          token: ${{ secrets.PUBLIC_SYNC_TOKEN }}
          path: destination

      - name: Sync site files
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/docs/' \
            source/ destination/

      - name: Commit and push changes
        working-directory: destination
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No site changes to sync.'
            exit 0
          fi
          git commit -m "Sync public site from ${GITHUB_SHA}"
          git push origin HEAD:main
